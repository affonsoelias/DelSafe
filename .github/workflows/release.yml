name: Release DelSafe

on:
  push:
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (stable or nightly)'
        required: false
        default: 'stable'

permissions:
  contents: write

jobs:
  check:
    name: Check Release Needed
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - name: Checkout main for schedule comparison
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compare main HEAD against nightly tag
        id: gate
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          NIGHTLY_SHA="$(git ls-remote origin refs/tags/nightly 'refs/tags/nightly^{}' | awk '/\^\{\}$/ { sha=$1 } END { print sha }')"
          if [[ -z "$NIGHTLY_SHA" ]]; then
            NIGHTLY_SHA="$(git ls-remote origin refs/tags/nightly | awk '{print $1}' | head -n 1 || true)"
          fi
          echo "main HEAD: ${{ github.sha }}"
          echo "nightly  : ${NIGHTLY_SHA:-<none>}"
          if [[ -n "$NIGHTLY_SHA" && "$NIGHTLY_SHA" == "${{ github.sha }}" ]]; then
            echo "No new commits on main since last nightly build; skipping."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New commits detected on main (or first nightly); proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build & Package (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Free Pascal on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc gcc build-essential pkg-config libsqlite3-dev

      - name: Install Free Pascal on macOS
        if: runner.os == 'macOS'
        run: |
          brew install fpc pkg-config sqlite

      - name: Install Free Pascal on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command fpc -ErrorAction SilentlyContinue)) {
            choco install lazarus -y --no-progress
            $fpcDir = Get-ChildItem "C:\lazarus\fpc" -Recurse -Filter "fpc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
            if ($fpcDir) { "$fpcDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
          if (Test-Path "C:\msys64\usr\bin\pacman.exe") {
            & C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-sqlite3
          }

      - name: Build and verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bin\delsafec.exe test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) { $ver = $tag.Substring(1) } else { $ver = "" }
          if ("${{ github.event_name }}" -eq "schedule" -or "${{ inputs.channel }}" -eq "nightly") { $ver = "nightly" }
          if ($ver) {
            powershell -ExecutionPolicy Bypass -File scripts/package_release.ps1 -Version $ver -OutDir dist -SkipBuild
          } else {
            powershell -ExecutionPolicy Bypass -File scripts/package_release.ps1 -OutDir dist -SkipBuild
          }

      - name: Build and verify on Linux / macOS
        if: runner.os != 'Windows'
        run: |
          chmod +x build.sh scripts/package_release.sh
          ./build.sh
          ./bin/delsafec test
          TAG="${{ github.ref_name }}"
          VER=""
          if [[ "$TAG" == v* ]]; then VER="${TAG#v}"; fi
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.channel }}" == "nightly" ]]; then VER="nightly"; fi
          if [[ -n "$VER" ]]; then
            ./scripts/package_release.sh --version="$VER" --out-dir=dist --skip-build
          else
            ./scripts/package_release.sh --out-dir=dist --skip-build
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*

  publish:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate release files & SHA256SUMS.txt
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release-files/ \;
          cat artifacts/**/SHA256SUMS.txt > release-files/SHA256SUMS.txt

      - name: Determine release tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.channel }}" == "nightly" ]]; then
            echo "tag=nightly" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Move nightly Git tag to current HEAD
        if: steps.meta.outputs.tag == 'nightly'
        run: |
          git tag -f nightly "${{ github.sha }}"
          git push -f origin refs/tags/nightly

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release-files/*
